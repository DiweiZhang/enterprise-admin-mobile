packages:
  - '.'

# 项目级依赖仓库与缓存，避免 pnpm 在 Windows 回退到盘符根目录。
storeDir: '.pnpm-store'
cacheDir: '.cache/pnpm'

publicHoistPattern:
  - '@vue*'
hoistPattern:
  - '*'

overrides:
  '@dcloudio/uni-app-harmony': '3.0.0-5030420261029002'
  '@intlify/message-compiler': '9.14.5'
  '@intlify/shared': '9.14.5'
